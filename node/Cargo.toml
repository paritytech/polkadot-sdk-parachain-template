[package]
name = "parachain-template-node"
description = "A parachain node template built with Substrate and Cumulus, part of Polkadot Sdk."
version = "0.0.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
clap = { features = ["derive"], workspace = true }
codec = { workspace = true, default-features = true }
color-print = { workspace = true }
docify = { workspace = true }
futures = { workspace = true }
jsonrpsee = { features = ["server"], workspace = true }
log = { workspace = true, default-features = true }
serde = { features = ["derive"], workspace = true, default-features = true }

polkadot-sdk = { workspace = true, features = ["node", "polkadot-primitives"] }

parachain-template-runtime = { workspace = true }

# Substrate
prometheus-endpoint = { workspace = true, default-features = true }

# Temporary: forwards `runtime-benchmarks` to the umbrella's `pallet-staking-async`.
# The next template sync removes this.
pallet-staking-async = { version = "0.18.0", default-features = false, optional = true }

[build-dependencies]
polkadot-sdk = { workspace = true, features = ["substrate-build-script-utils"] }

[features]
default = ["std"]
std = [
	"log/std",
	"parachain-template-runtime/std",
	"polkadot-sdk/std",
]
runtime-benchmarks = [
	"dep:pallet-staking-async",
	"pallet-staking-async/runtime-benchmarks",
	"parachain-template-runtime/runtime-benchmarks",
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"parachain-template-runtime/try-runtime",
	"polkadot-sdk/try-runtime",
]
